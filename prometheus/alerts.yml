groups:
  - name: nlp_prediction_api
    rules:
      - alert: SystemDown
        expr: min(up{job="nlp-prediction-api"}) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "NLP system is down"
          description: "The NLP Product Description API has been unreachable for more than 1 minute."

      - alert: HighAPILatency
        expr: histogram_quantile(0.95, sum by (le) (rate(nlp_request_latency_seconds_bucket[5m]))) > 2.0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High API latency detected"
          description: "P95 latency is above 2 seconds for the NLP API."

      - alert: HighErrorRate
        expr: |
          sum(rate(nlp_model_calls_total{status="error"}[5m]))
          /
          sum(rate(nlp_model_calls_total[5m])) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High error rate on NLP generation API"
          description: "More than 5% of model calls are failing."

      - alert: APIDown
        expr: up{job="nlp-prediction-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "NLP Product Description API is down"
          description: "No healthy instances of nlp-prediction-api found."

  - name: kubernetes_pods
    rules:
      - alert: PodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total{namespace="nlp-prediction"}[15m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pod is crash-looping"
          description: "A pod in the nlp-prediction namespace is restarting frequently."

      - alert: HighMemoryUsage
        expr: |
          container_memory_usage_bytes{namespace="nlp-prediction"}
          /
          container_spec_memory_limit_bytes{namespace="nlp-prediction"} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container memory usage > 85%"
          description: "A container in the nlp-prediction namespace is using more than 85% of its memory limit."
