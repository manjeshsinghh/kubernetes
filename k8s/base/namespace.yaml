---
# ─── Namespace ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: nlp-prediction
  labels:
    app: nlp-prediction
    monitoring: "true"

---
# ─── ConfigMap ────────────────────────────────────────────────────────────────
# Why ConfigMap? Externalise configuration from the container image.
# Change env vars without rebuilding Docker images.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nlp-prediction-config
  namespace: nlp-prediction
data:
  DATASET_PATH: "/app/amazon.csv.zip"
  LOG_LEVEL: "INFO"
  API_URL: "http://nlp-prediction-api-service:8000"
